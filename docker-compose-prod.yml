version: "3.9"

services:
  # ---------------- Development ----------------
  quiz-app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: quiz-app-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host

  # ---------------- Production ----------------
  quiz-app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: quiz-app-prod
    ports:
      - "8080:80"
    restart: always
