apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app-deployment
  namespace: quiz-app-ns
  labels:
    app: quiz-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-app
  template:
    metadata:
      labels:
        app: quiz-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      containers:
        - name: quiz-app
          image: quiz-app:latest # Jenkins replaces this dynamically
          imagePullPolicy: Never
          ports:
            - containerPort: 80
